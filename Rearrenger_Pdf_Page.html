<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reorder PDF Pages - Local Tool</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        /* --- RESET & BASICS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #f3f0ec;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- NAVBAR --- */
        .navbar {
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { font-weight: 800; font-size: 1.5rem; color: #333; }
        .logo span { color: #e5322d; }

        /* --- MAIN CONTAINER --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 15px; color: #333; }
        .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 40px; max-width: 600px; }

        /* --- BUTTONS --- */
        .btn-red {
            background-color: #e5322d;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 20px 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(229, 50, 45, 0.3);
        }
        .btn-red:hover { background-color: #d62c27; transform: translateY(-2px); }
        .btn-red:disabled { background-color: #ccc; cursor: not-allowed; transform: none; box-shadow: none;}

        /* --- WORKSPACE (Hidden initially) --- */
        .workspace {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            display: none;
            text-align: left;
        }

        .file-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            border-left: 5px solid #e5322d;
        }

        label { font-weight: bold; display: block; margin-bottom: 10px; }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        
        input[type="text"]:focus {
            border-color: #e5322d;
            outline: none;
        }

        .help-text { font-size: 0.9rem; color: #888; margin-bottom: 25px; }

        .hidden { display: none; }
        
        .error-msg { color: #e5322d; margin-top: 10px; font-weight: bold; display: none;}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Reorder <span>PDF</span></div>
        <div style="font-size: 0.9rem; color: #666;">Local Secure Tool</div>
    </nav>

    <div class="main-container">
        
        <div id="step1">
            <h1>Rearrange PDF Pages</h1>
            <p class="subtitle">Change the order of your PDF pages or delete pages by defining a custom sequence.</p>
            <button class="btn-red" onclick="document.getElementById('fileInput').click()">Select PDF File</button>
            <input type="file" id="fileInput" accept=".pdf" class="hidden">
        </div>

        <div id="step2" class="workspace">
            <div class="file-info">
                <h3 id="fileName">document.pdf</h3>
                <p style="color:#666; margin-top:5px;">Total Pages: <strong id="pageCount">0</strong></p>
            </div>

            <label for="orderInput">Enter page order:</label>
            <input type="text" id="orderInput" placeholder="Example: 1, 5, 2, 8, 3">
            <p class="help-text">Separate numbers with commas. Example: <b>1, 3, 2</b> will create a PDF with Page 1, then Page 3, then Page 2.</p>

            <button class="btn-red" id="processBtn" style="width: 100%; padding: 15px;">Reorder PDF</button>
            
            <div id="errorMsg" class="error-msg"></div>

            <button onclick="location.reload()" style="background:none; border:none; color:#666; width:100%; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>

    </div>

<script>
    const { PDFDocument } = PDFLib;
    
    // Elements
    const fileInput = document.getElementById('fileInput');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const fileNameEl = document.getElementById('fileName');
    const pageCountEl = document.getElementById('pageCount');
    const orderInput = document.getElementById('orderInput');
    const processBtn = document.getElementById('processBtn');
    const errorMsg = document.getElementById('errorMsg');

    let currentPdfBytes = null;
    let totalPages = 0;

    // 1. Handle File Selection
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || file.type !== 'application/pdf') return;

        try {
            // Read file
            currentPdfBytes = await file.arrayBuffer();
            
            // Load header to get page count
            const pdfDoc = await PDFDocument.load(currentPdfBytes);
            totalPages = pdfDoc.getPageCount();

            // Update UI
            fileNameEl.textContent = file.name;
            pageCountEl.textContent = totalPages;
            
            // Switch screens
            step1.classList.add('hidden');
            step2.style.display = 'block';
            
            // Set default valid input
            orderInput.value = Array.from({length: totalPages}, (_, i) => i + 1).join(', ');

        } catch (err) {
            console.error(err);
            alert("Error loading PDF. Please try another file.");
        }
    });

    // 2. Process Button
    processBtn.addEventListener('click', async () => {
        const inputStr = orderInput.value.trim();
        errorMsg.style.display = 'none';

        if (!inputStr) {
            showError("Please enter page numbers.");
            return;
        }

        // Clean input: remove brackets ( ) and spaces, split by comma
        // Regex matches anything that isn't a digit or a comma
        const cleanStr = inputStr.replace(/[^\d,]/g, ''); 
        
        if (!cleanStr) {
            showError("Invalid format. Use numbers separated by commas.");
            return;
        }

        // Convert to array of numbers
        const requestedPages = cleanStr.split(',')
            .filter(item => item.trim() !== '') // Remove empty items
            .map(num => parseInt(num.trim()));

        // Validate pages
        const invalidPages = requestedPages.filter(p => p < 1 || p > totalPages);
        if (invalidPages.length > 0) {
            showError(`Invalid page numbers: ${invalidPages.join(', ')}. Max page is ${totalPages}.`);
            return;
        }

        if (requestedPages.length === 0) {
            showError("No valid pages found.");
            return;
        }

        // Start Processing
        processBtn.innerText = "Processing...";
        processBtn.disabled = true;

        try {
            // Create new PDF
            const newPdf = await PDFDocument.create();
            const sourcePdf = await PDFDocument.load(currentPdfBytes);

            // Convert 1-based user input to 0-based index
            const pageIndices = requestedPages.map(p => p - 1);

            // Copy pages
            const copiedPages = await newPdf.copyPages(sourcePdf, pageIndices);

            // Add them to the new document
            copiedPages.forEach(page => newPdf.addPage(page));

            // Save and Download
            const pdfBytes = await newPdf.save();
            download(pdfBytes, "reordered_document.pdf");

            processBtn.innerText = "Reorder PDF";
            processBtn.disabled = false;
            
        } catch (err) {
            console.error(err);
            showError("An error occurred while processing.");
            processBtn.innerText = "Reorder PDF";
            processBtn.disabled = false;
        }
    });

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }

    function download(data, filename) {
        const blob = new Blob([data], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
