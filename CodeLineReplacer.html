<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Replacer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #61afef;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            height: calc(100vh - 100px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .middle-panel {
            flex: 1.2;
            overflow-y: auto;
        }

        h3 {
            margin-bottom: 10px;
            color: #c678dd;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #61afef;
        }

        .rule-box {
            background: #2d2d30;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #e5c07b;
        }

        .rule-header {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .rule-header input {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            width: 120px;
        }

        .rule-box textarea {
            height: 120px;
            flex-grow: 0;
            margin-bottom: 10px;
        }

        button {
            background: #61afef;
            color: #1e1e1e;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #4b92d6;
        }

        .btn-remove {
            background: #e06c75;
            color: white;
            padding: 6px 12px;
        }

        .btn-remove:hover {
            background: #be5058;
        }

        .btn-add {
            background: #98c379;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-add:hover {
            background: #7ca85e;
        }
        
        .btn-apply {
            background: #e5c07b;
            font-size: 16px;
            padding: 15px;
            width: 100%;
            margin-top: auto;
        }

        .btn-apply:hover {
            background: #d1a85c;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-copy {
            background: #56b6c2;
            padding: 6px 12px;
            font-size: 12px;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .panel {
                min-height: 400px;
                margin-bottom: 20px;
            }
            
            .middle-panel {
                min-height: 500px;
            }

            .rule-header {
                flex-wrap: wrap;
            }

            .rule-header input {
                flex: 1;
                min-width: 80px;
            }

            .btn-remove {
                width: 100%;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>

    <h1>AI Code Line Replacer</h1>

    <div class="container">
        <!-- Left Panel: Original Code -->
        <div class="panel">
            <h3>Original Code</h3>
            <textarea id="originalCode" placeholder="Paste your 10,000+ lines of code here..."></textarea>
        </div>

        <!-- Middle Panel: Replacement Rules -->
        <div class="panel middle-panel">
            <h3>Replacement Rules</h3>
            <button class="btn-add" onclick="addRule()">+ Add Another Line Change</button>
            
            <div id="rulesContainer">
                <!-- Single Rule Box -->
                <div class="rule-box">
                    <div class="rule-header">
                        <label>Line:</label>
                        <input type="number" class="start-line" placeholder="Start (e.g. 10)" min="1">
                        <label>To:</label>
                        <input type="number" class="end-line" placeholder="End (e.g. 15)" min="1" title="If it's just one line, keep it same as start line">
                        <button class="btn-remove" onclick="removeRule(this)">Remove</button>
                    </div>
                    <textarea class="new-code" placeholder="Paste the exact new code that AI provided..."></textarea>
                </div>
            </div>

            <button class="btn-apply" onclick="applyChanges()">Apply Changes & Generate Code</button>
        </div>

        <!-- Right Panel: Updated Code -->
        <div class="panel">
            <div class="header-actions">
                <h3 style="margin: 0;">Updated Code</h3>
                <button class="btn-copy" onclick="copyCode()">Copy Code</button>
            </div>
            <textarea id="updatedCode" placeholder="Your modified code will appear here..." readonly></textarea>
        </div>
    </div>

    <script>
        // Function to add a new rule box dynamically
        function addRule() {
            const container = document.getElementById('rulesContainer');
            const ruleHTML = `
                <div class="rule-box">
                    <div class="rule-header">
                        <label>Line:</label>
                        <input type="number" class="start-line" placeholder="Start" min="1">
                        <label>To:</label>
                        <input type="number" class="end-line" placeholder="End" min="1">
                        <button class="btn-remove" onclick="removeRule(this)">Remove</button>
                    </div>
                    <textarea class="new-code" placeholder="Paste the exact new code that AI provided..."></textarea>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', ruleHTML);
        }

        // Function to remove a rule box
        function removeRule(btn) {
            btn.closest('.rule-box').remove();
        }

        // Main logic to apply code changes
        function applyChanges() {
            const originalCode = document.getElementById('originalCode').value;
            if (!originalCode.trim()) {
                alert("Please paste your original code first.");
                return;
            }

            // Split code into array of lines
            let lines = originalCode.split('\n');
            const ruleBoxes = document.querySelectorAll('.rule-box');
            let rules = [];

            // Collect and validate all rules
            ruleBoxes.forEach(box => {
                let start = parseInt(box.querySelector('.start-line').value);
                let end = parseInt(box.querySelector('.end-line').value);
                let newCode = box.querySelector('.new-code').value;

                if (isNaN(start)) return; // Skip if start line is empty
                if (isNaN(end)) end = start; // If end line is empty, assume single line replacement
                if (end < start) end = start; // Fix invalid ranges

                rules.push({ start, end, newCode });
            });

            // Sort rules by start line in DESCENDING order (Crucial step)
            rules.sort((a, b) => b.start - a.start);

            // Apply each replacement
            rules.forEach(rule => {
                let startIndex = rule.start - 1; 
                let linesToDelete = rule.end - rule.start + 1;

                if (startIndex >= lines.length) startIndex = lines.length - 1;

                lines.splice(startIndex, linesToDelete, rule.newCode);
            });

            // Join the array back into a string and display
            document.getElementById('updatedCode').value = lines.join('\n');
            
            // On mobile, scroll down automatically to the result box
            if (window.innerWidth <= 900) {
                document.getElementById('updatedCode').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Function to copy the generated code to clipboard
        function copyCode() {
            const updatedCode = document.getElementById('updatedCode');
            if (!updatedCode.value.trim()) {
                alert("Nothing to copy!");
                return;
            }
            updatedCode.select();
            document.execCommand('copy');
            
            // Visual feedback
            const copyBtn = document.querySelector('.btn-copy');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "Copied!";
            copyBtn.style.background = "#98c379";
            
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.background = "#56b6c2";
            }, 2000);
        }
    </script>
</body>
</html>
