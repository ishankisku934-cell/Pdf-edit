<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Dark Mode & AMOLED Converter</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }
        p { color: #aaaaaa; margin-bottom: 30px; }

        .container {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Upload Section */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn-upload {
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            background-color: transparent;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-upload:hover {
            background-color: var(--primary-color);
            color: #000;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button.filter-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.filter-btn:hover { background-color: #444; }
        
        button.download-btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: none; /* Hidden until image is loaded */
        }

        /* Canvas */
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: 10px;
            max-height: 500px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Dark Mode Converter</h1>
    <p>Upload an image to Invert, Dim, or convert to AMOLED Black.</p>

    <div class="container">
        <div class="upload-btn-wrapper">
            <button class="btn-upload">📂 Upload Image</button>
            <input type="file" id="uploadInput" accept="image/*">
        </div>

        <div class="controls">
            <button class="filter-btn" onclick="applyFilter('original')">Reset</button>
            <button class="filter-btn" onclick="applyFilter('invert')">Invert Colors</button>
            <button class="filter-btn" onclick="applyFilter('night')">Night Mode (Dim)</button>
            <button class="filter-btn" onclick="applyFilter('amoled')">AMOLED Black</button>
        </div>

        <canvas id="imageCanvas"></canvas>
        <br>
        <button id="downloadBtn" class="download-btn" onclick="downloadImage()">⬇ Download Image</button>
    </div>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = new Image();
        let fileName = "";

        // Handle Image Upload
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileName = file.name.split('.')[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                originalImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        originalImage.onload = function() {
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0);
            downloadBtn.style.display = "inline-block";
        }

        // Filter Logic
        function applyFilter(type) {
            if (!originalImage.src) {
                alert("Please upload an image first!");
                return;
            }

            // Always reset to original before applying a new filter
            ctx.drawImage(originalImage, 0, 0);
            
            if (type === 'original') return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                if (type === 'invert') {
                    // Standard Inversion
                    data[i] = 255 - r;
                    data[i + 1] = 255 - g;
                    data[i + 2] = 255 - b;
                } 
                else if (type === 'night') {
                    // Dimming + Warmth
                    data[i] = r * 0.7;     
                    data[i + 1] = g * 0.6; 
                    data[i + 2] = b * 0.4; 
                }
                else if (type === 'amoled') {
                    // 1. INVERT Colors first (so white bg becomes black)
                    let ir = 255 - r;
                    let ig = 255 - g;
                    let ib = 255 - b;

                    // 2. Calculate Brightness of the INVERTED pixel
                    // Using luminance formula for better accuracy: 0.299R + 0.587G + 0.114B
                    let brightness = (0.299 * ir) + (0.587 * ig) + (0.114 * ib);
                    
                    // 3. Thresholding
                    // If the inverted pixel is Dark Gray (approx brightness < 40), snap to True Black
                    if (brightness < 40) {
                        data[i] = 0;
                        data[i + 1] = 0;
                        data[i + 2] = 0;
                    } else {
                        // Keep the inverted content (text/images)
                        data[i] = ir;
                        data[i + 1] = ig;
                        data[i + 2] = ib;
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = fileName + '-edited.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>

</body>
</html>
